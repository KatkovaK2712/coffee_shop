<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}🎨 Кофейня Уютный Котик{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --neon-green: #39ff14;
            --neon-purple: #bf00ff;
            --dark-bg: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.1);
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        
        .neon-text {
            text-shadow: 
                0 0 10px currentColor,
                0 0 20px currentColor,
                0 0 40px currentColor;
            animation: neonGlow 2s ease-in-out infinite alternate;
        }
        
        @keyframes neonGlow {
            from { text-shadow: 0 0 10px currentColor, 0 0 20px currentColor; }
            to { text-shadow: 0 0 20px currentColor, 0 0 40px currentColor, 0 0 60px currentColor; }
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .glass-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.4),
                0 0 0 2px var(--neon-pink),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        
        .navbar {
            background: rgba(10, 10, 10, 0.9) !important;
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--neon-pink);
            box-shadow: 0 4px 30px rgba(255, 0, 255, 0.3);
        }
        
        .nav-link {
            color: white !important;
            font-weight: 500;
            padding: 0.7rem 1.5rem;
            margin: 0 0.3rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .nav-link:hover::before {
            left: 100%;
        }
        
        .nav-link:hover {
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 255, 0.4);
        }
        
        .nav-link.active {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-green));
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        
        .logo {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: logoRainbow 3s ease-in-out infinite;
        }
        
        @keyframes logoRainbow {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(360deg); }
        }
        
        .btn-neon {
            background: transparent;
            border: 2px solid;
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-neon::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .btn-neon:hover::before {
            left: 100%;
        }
        
        .btn-neon-pink {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink), inset 0 0 10px var(--neon-pink);
        }
        
        .btn-neon-pink:hover {
            background: var(--neon-pink);
            color: black;
            box-shadow: 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
            transform: translateY(-3px);
        }
        
        .btn-neon-blue {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue), inset 0 0 10px var(--neon-blue);
        }
        
        .btn-neon-blue:hover {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 20px var(--neon-blue), 0 0 40px var(--neon-blue);
            transform: translateY(-3px);
        }
        
        .floating {
            animation: floating 3s ease-in-out infinite;
        }
        
        @keyframes floating {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 255, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255, 0, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 255, 0); }
        }
        
        .cat-emoji {
            font-size: 3rem;
            animation: bounce 2s infinite, rotate 4s linear infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.1); }
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .feature-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2.5rem;
            color: white;
            animation: float 3s ease-in-out infinite;
            box-shadow: 0 0 30px var(--neon-pink);
        }
        
        .menu-item-card {
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s ease;
            border: none;
        }
        
        .menu-item-card:hover .card-img-top {
            transform: scale(1.1) rotate(2deg);
        }
        
        .card-img-top {
            transition: transform 0.4s ease;
            height: 250px;
            object-fit: cover;
        }
        
        .price-tag {
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple));
            color: white;
            padding: 0.7rem 1.5rem;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.3rem;
            box-shadow: 0 5px 15px rgba(255, 0, 255, 0.4);
        }
        
        .special-badge {
            background: linear-gradient(45deg, #ff0000, #ff6b6b);
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 20px #ff0000;
        }
        
        footer {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            margin-top: 4rem;
            border-top: 2px solid var(--neon-blue);
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            background: var(--neon-pink);
            border-radius: 50%;
            animation: floatParticle 20s infinite linear;
        }
        
        @keyframes floatParticle {
            0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) translateX(100px) rotate(360deg); opacity: 0; }
        }
		/* Стили для выбора времени в предзаказе */
        select.glass-input option {
            background: rgba(10, 10, 10, 0.9) !important;
            color: white !important;
            padding: 10px !important;
        }

        select.glass-input option:hover {
            background: var(--neon-pink) !important;
            color: black !important;
        }

        select.glass-input option:checked {
            background: var(--neon-blue) !important;
            color: black !important;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Анимированные частицы -->
    <div class="particles" id="particles"></div>
    
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand logo" href="{% url 'home' %}">
                🐱 Уютный Котик ✨
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{% url 'home' %}">
                            <i class="fas fa-home me-2"></i>Главная
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/menu/' %}active{% endif %}" href="{% url 'menu' %}">
                            <i class="fas fa-utensils me-2"></i>Меню
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/about/' %}active{% endif %}" href="{% url 'about' %}">
                            <i class="fas fa-heart me-2"></i>О нас
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/preorder/' %}active{% endif %}" href="{% url 'preorder' %}">
                            <i class="fas fa-shopping-cart me-2"></i>Заказ
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/contacts/' %}active{% endif %}" href="{% url 'contacts' %}">
                            <i class="fas fa-map-marker-alt me-2"></i>Контакты
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/reviews/' %}active{% endif %}" href="{% url 'reviews' %}">
                            <i class="fas fa-star me-2"></i>Отзывы
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="py-5 mt-5">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Подвал -->
    <footer class="text-white py-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start">
                    <h5 class="neon-text mb-3" style="color: var(--neon-green);">🐾 Кофейня "Уютный Котик"</h5>
                    <p>Где каждый напиток - это искусство, а котики - наши вдохновители! ✨</p>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <p><i class="fas fa-phone me-2" style="color: var(--neon-blue);"></i>+7 (999) 123-45-67</p>
                    <p><i class="fas fa-map-marker-alt me-2" style="color: var(--neon-pink);"></i>г. Москва, ул. Котикова, 15</p>
                    <div class="mt-3">
                        <a href="#" class="text-white me-3 neon-text" style="color: var(--neon-pink);"><i class="fab fa-instagram fa-lg"></i></a>
                        <a href="#" class="text-white me-3 neon-text" style="color: var(--neon-blue);"><i class="fab fa-telegram fa-lg"></i></a>
                        <a href="#" class="text-white neon-text" style="color: var(--neon-green);"><i class="fab fa-vk fa-lg"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Создание анимированных частиц
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const colors = ['#ff00ff', '#00ffff', '#39ff14', '#bf00ff'];
            
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 10 + 5;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const duration = Math.random() * 20 + 10;
                const delay = Math.random() * 20;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.background = color;
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Интерактивные котики
        function showCatMessage() {
            const messages = [
                "Мяу! Готовлю для тебя самый лучший кофе! ☕🐱",
                "Погладь меня и получи магическую скидку! ✨🐾",
                "Этот кофе заставит тебя мурлыкать! 😻",
                "Я - главный дегустатор и одобряю этот напиток! 👑",
                "Попробуй наш неоновый латте! Он светится! 🌟"
            ];
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            
            // Создаем всплывающее окно с неоновым стилем
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0, 0, 0, 0.9);
                padding: 2rem;
                border-radius: 20px;
                border: 2px solid var(--neon-pink);
                box-shadow: 0 0 30px var(--neon-pink);
                z-index: 10000;
                color: white;
                text-align: center;
                backdrop-filter: blur(10px);
            `;
            modal.innerHTML = `
                <div class="cat-emoji">🐱</div>
                <h4 class="neon-text" style="color: var(--neon-pink);">${randomMessage}</h4>
                <button onclick="this.parentElement.remove()" class="btn-neon btn-neon-blue mt-3">OK</button>
            `;
            document.body.appendChild(modal);
        }
        
        // Анимация при скролле
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            
            // Плавная прокрутка
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                });
            });
            
            // Анимация появления элементов
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, { threshold: 0.1 });
            
            document.querySelectorAll('.glass-card').forEach((card) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(50px)';
                card.style.transition = 'all 0.6s ease';
                observer.observe(card);
            });
        });
        
        // Случайные неоновые эффекты
        setInterval(() => {
            const elements = document.querySelectorAll('.neon-text');
            elements.forEach(el => {
                const colors = ['#ff00ff', '#00ffff', '#39ff14', '#bf00ff'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                el.style.color = randomColor;
            });
        }, 3000);
    </script>
</body>
</html>
